        function renderCards() {
            const content = document.getElementById('content');
            let html = '';
            cardData.forEach(item => {
                // 如果有 targetUrl，点击跳转，否则弹窗演示
                const clickAction = item.targetUrl 
                    ? `window.location.href='${item.targetUrl}'` 
                    : `alert('模拟跳转：${item.title}')`;
                
                html += `
                <div class="card" onclick="${clickAction}">
                    <img src="${item.image}" class="card-image" loading="lazy">
                    <div class="card-content">
                        <div class="card-title">
                            ${item.isAd ? '<span style="color:#ccc;font-weight:normal;font-size:10px;border:1px solid #eee;padding:0 2px;margin-right:2px;">赞助</span>' : ''}
                            ${item.title}
                        </div>
                        <div class="card-footer">
                            <div class="card-user">
                                <div class="user-avatar" style="background:${getRandomColor()}"></div>
                                <span>${item.user}</span>
                            </div>
                            <div class="card-likes">
                                <i class="far fa-heart"></i> ${item.likes}
                            </div>
                        </div>
                    </div>
                </div>`;
            });
            content.innerHTML = html;
        }

        function getRandomColor() {
            const colors = ['#FFC2CC', '#C2E0FF', '#E0FFC2', '#FFDFC2'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        renderCards();
